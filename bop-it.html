<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOP IT!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      font-family: 'Arial Black', 'Arial Bold', Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #counter {
      color: #fff;
      font-size: clamp(1rem, 3vw, 1.4rem);
      margin-bottom: 2.5rem;
      letter-spacing: 0.05em;
      opacity: 0.9;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
      transition: transform 0.1s;
    }

    #counter.bump {
      animation: counterBump 0.3s ease-out;
    }

    @keyframes counterBump {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.4); color: #ffdd57; }
      100% { transform: scale(1); }
    }

    #btn-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #bop-btn {
      width: clamp(220px, 60vw, 360px);
      height: clamp(90px, 22vw, 130px);
      border: none;
      border-radius: 18px;
      font-family: inherit;
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      font-weight: 900;
      cursor: pointer;
      position: relative;
      background: linear-gradient(145deg, #ff6b35, #f7931e);
      color: #fff;
      text-shadow: 2px 3px 6px rgba(0,0,0,0.35);
      box-shadow: 0 8px 0 #b84a00, 0 12px 30px rgba(0,0,0,0.5);
      transform-origin: center bottom;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s, background 0.15s;
      will-change: transform;
      letter-spacing: 0.04em;
    }

    #bop-btn:active {
      transform: translateY(5px) scaleY(0.93);
      box-shadow: 0 3px 0 #b84a00, 0 6px 15px rgba(0,0,0,0.5);
    }

    /* ── Keyframe animations ── */

    @keyframes animSpin {
      0%   { transform: rotate(0deg) scale(1); }
      30%  { transform: rotate(200deg) scale(1.15); }
      70%  { transform: rotate(340deg) scale(0.9); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes animFly {
      0%   { transform: translateY(0) scale(1); opacity: 1; }
      35%  { transform: translateY(-130vh) scale(0.5); opacity: 0; }
      36%  { transform: translateY(130vh) scale(0.5); opacity: 0; }
      70%  { transform: translateY(-20px) scale(1.05); opacity: 1; }
      85%  { transform: translateY(6px) scale(0.98); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes animShake {
      0%,100% { transform: translate(0,0) rotate(0deg); }
      10%      { transform: translate(-18px,-4px) rotate(-4deg); }
      20%      { transform: translate(18px, 4px) rotate( 4deg); }
      30%      { transform: translate(-16px,-3px) rotate(-3deg); }
      40%      { transform: translate(16px, 3px) rotate( 3deg); }
      50%      { transform: translate(-12px, 0px) rotate(-2deg); }
      60%      { transform: translate(12px, 0px) rotate( 2deg); }
      70%      { transform: translate(-8px,-2px) rotate(-1deg); }
      80%      { transform: translate( 8px, 2px) rotate( 1deg); }
      90%      { transform: translate(-4px, 0px); }
    }

    @keyframes animGrow {
      0%   { transform: scale(1); }
      35%  { transform: scale(2.3) rotate(-3deg); }
      55%  { transform: scale(2.3) rotate( 3deg); }
      75%  { transform: scale(0.82); }
      90%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes animWobble {
      0%,100% { transform: skewX(0deg) scaleX(1); }
      15%     { transform: skewX(12deg) scaleX(0.9); }
      30%     { transform: skewX(-10deg) scaleX(1.1); }
      45%     { transform: skewX(8deg) scaleX(0.95); }
      60%     { transform: skewX(-6deg) scaleX(1.05); }
      75%     { transform: skewX(3deg) scaleX(0.98); }
    }

    /* Flash overlay */
    #flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      z-index: 900;
    }

    @keyframes doFlash {
      0%   { opacity: 0.75; }
      100% { opacity: 0; }
    }

    /* Confetti */
    .cp {
      position: fixed;
      pointer-events: none;
      z-index: 950;
      animation: cpFall var(--dur) ease-out forwards;
    }

    @keyframes cpFall {
      0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(0.4); opacity: 0; }
    }

    /* Stars burst */
    .star {
      position: fixed;
      pointer-events: none;
      z-index: 950;
      font-size: 1.4rem;
      animation: starBurst var(--dur) ease-out forwards;
    }

    @keyframes starBurst {
      0%   { transform: translate(0,0) scale(0) rotate(0deg); opacity: 1; }
      60%  { opacity: 1; }
      100% { transform: translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--rot)); opacity: 0; }
    }

    @keyframes animBounce {
      0%,100% { transform: translateY(0) scaleY(1); }
      20%     { transform: translateY(-60px) scaleY(1.1); }
      40%     { transform: translateY(0) scaleY(0.85) scaleX(1.1); }
      55%     { transform: translateY(-30px) scaleY(1.05); }
      70%     { transform: translateY(0) scaleY(0.92) scaleX(1.05); }
      82%     { transform: translateY(-12px); }
      92%     { transform: translateY(0) scaleY(0.97); }
    }

    @keyframes animFlip {
      0%   { transform: perspective(600px) rotateY(0deg); }
      40%  { transform: perspective(600px) rotateY(200deg) scale(1.1); }
      70%  { transform: perspective(600px) rotateY(340deg) scale(0.9); }
      100% { transform: perspective(600px) rotateY(360deg); }
    }

    @keyframes animRubber {
      0%,100% { transform: scale(1,1); }
      20%     { transform: scale(1.5,0.6); }
      35%     { transform: scale(0.75,1.25); }
      50%     { transform: scale(1.2,0.85); }
      65%     { transform: scale(0.9,1.1); }
      80%     { transform: scale(1.05,0.95); }
    }

    @keyframes animShrink {
      0%   { transform: scale(1); opacity: 1; }
      35%  { transform: scale(0.05); opacity: 0.3; }
      60%  { transform: scale(1.25); opacity: 1; }
      80%  { transform: scale(0.92); }
      100% { transform: scale(1); }
    }

    @keyframes animTwirl {
      0%   { transform: rotate(0deg) scale(1); }
      25%  { transform: rotate(180deg) scale(1.2); }
      50%  { transform: rotate(360deg) scale(0.8); }
      75%  { transform: rotate(540deg) scale(1.15); }
      100% { transform: rotate(720deg) scale(1); }
    }

    @keyframes animDrunk {
      0%,100% { transform: rotate(0deg) translateX(0); }
      15%  { transform: rotate(-8deg) translateX(-20px); }
      30%  { transform: rotate(7deg) translateX(18px); }
      45%  { transform: rotate(-9deg) translateX(-15px); }
      60%  { transform: rotate(6deg) translateX(12px); }
      75%  { transform: rotate(-4deg) translateX(-8px); }
      88%  { transform: rotate(2deg) translateX(4px); }
    }

    @keyframes animJello {
      0%,100% { transform: scale(1,1); }
      11% { transform: scale(0.9,1.1); }
      22% { transform: scale(1.15,0.85); }
      33% { transform: scale(0.92,1.08); }
      44% { transform: scale(1.08,0.92); }
      55% { transform: scale(0.96,1.04); }
      66% { transform: scale(1.04,0.96); }
      78% { transform: scale(0.99,1.01); }
    }

    @keyframes animPogo {
      0%,100% { transform: translateY(0) scaleY(1); }
      12%  { transform: translateY(-70px) scaleY(1.1); }
      22%  { transform: translateY(0) scaleY(0.78) scaleX(1.25); }
      32%  { transform: translateY(-45px) scaleY(1.06); }
      42%  { transform: translateY(0) scaleY(0.86) scaleX(1.12); }
      52%  { transform: translateY(-22px) scaleY(1.03); }
      62%  { transform: translateY(0) scaleY(0.93); }
      72%  { transform: translateY(-8px); }
      82%  { transform: translateY(0) scaleY(0.97); }
    }

    @keyframes animSwing {
      0%,100% { transform: rotate(0deg); transform-origin: top center; }
      20% { transform: rotate(18deg); transform-origin: top center; }
      40% { transform: rotate(-14deg); transform-origin: top center; }
      60% { transform: rotate(9deg); transform-origin: top center; }
      80% { transform: rotate(-5deg); transform-origin: top center; }
    }

    @keyframes animVibrate {
      0%,100% { transform: translate(0,0); }
      10% { transform: translate(-3px,-2px); }
      20% { transform: translate(3px,2px); }
      30% { transform: translate(-4px,1px); }
      40% { transform: translate(4px,-1px); }
      50% { transform: translate(-3px,3px); }
      60% { transform: translate(3px,-3px); }
      70% { transform: translate(-2px,2px); }
      80% { transform: translate(2px,-2px); }
      90% { transform: translate(-1px,1px); }
    }

    @keyframes animTada {
      0%,100% { transform: scale(1) rotate(0deg); }
      10%,20% { transform: scale(0.88) rotate(-4deg); }
      30%,50%,70%,90% { transform: scale(1.12) rotate(4deg); }
      40%,60%,80% { transform: scale(1.12) rotate(-4deg); }
    }

    @keyframes animDropIn {
      0%   { transform: translateY(-220px) scaleY(1.3); opacity: 0; }
      55%  { transform: translateY(12px) scaleY(0.82); opacity: 1; }
      75%  { transform: translateY(-8px) scaleY(1.06); }
      90%  { transform: translateY(3px) scaleY(0.98); }
      100% { transform: translateY(0) scaleY(1); }
    }

    @keyframes animSpin3D {
      0%   { transform: perspective(600px) rotateX(0deg); }
      35%  { transform: perspective(600px) rotateX(200deg) scale(1.15); }
      70%  { transform: perspective(600px) rotateX(340deg) scale(0.88); }
      100% { transform: perspective(600px) rotateX(360deg); }
    }

    @keyframes animCrumple {
      0%   { transform: scaleY(1) scaleX(1); }
      28%  { transform: scaleY(0.04) scaleX(1.6); }
      55%  { transform: scaleY(1.35) scaleX(0.78); }
      75%  { transform: scaleY(0.88) scaleX(1.06); }
      90%  { transform: scaleY(1.04) scaleX(0.98); }
      100% { transform: scaleY(1) scaleX(1); }
    }

    @keyframes animHammer {
      0%   { transform: translateY(-180px) rotate(-25deg); opacity: 0.2; }
      42%  { transform: translateY(10px) rotate(6deg) scaleY(0.75); opacity: 1; }
      58%  { transform: translateY(-18px) rotate(-4deg); }
      76%  { transform: translateY(5px) scaleY(0.96); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    @keyframes animPinwheel {
      0%   { transform: rotate(0deg) scale(1); }
      25%  { transform: rotate(270deg) scale(1.2); }
      50%  { transform: rotate(540deg) scale(0.82); }
      75%  { transform: rotate(810deg) scale(1.12); }
      100% { transform: rotate(1080deg) scale(1); }
    }

    @keyframes animRollLeft {
      0%   { transform: translateX(0) rotate(0deg); opacity: 1; }
      40%  { transform: translateX(-130vw) rotate(-360deg); opacity: 0; }
      41%  { transform: translateX(130vw) rotate(360deg); opacity: 0; }
      75%  { transform: translateX(-15px) rotate(-10deg); opacity: 1; }
      90%  { transform: translateX(5px) rotate(3deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    /* Split clones */
    .split-clone {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      border-radius: 18px;
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1),
                  opacity 0.28s ease;
    }
  </style>

  /* ── Audio ── */
  function ctx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function makeGain(vol, t0, decay) {
    const g = ctx().createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);
    g.connect(ctx().destination);
    return g;
  }

  function playBoing() {
    const c = ctx(), t = c.currentTime;
    const osc  = c.createOscillator();
    const lfo  = c.createOscillator();
    const lfoG = c.createGain();
    const gain = makeGain(0.45, t, 0.65);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(700, t);
    osc.frequency.exponentialRampToValueAtTime(140, t + 0.65);
    lfo.frequency.value = 14;
    lfoG.gain.value = 28;
    lfo.connect(lfoG); lfoG.connect(osc.frequency);
    osc.connect(gain);
    lfo.start(t); osc.start(t);
    lfo.stop(t + 0.65); osc.stop(t + 0.65);
  }

  function playWhoosh() {
    const c = ctx(), t = c.currentTime;
    const dur = 0.45;
    const size = Math.floor(c.sampleRate * dur);
    const buf  = c.createBuffer(1, size, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / size);
    const src  = c.createBufferSource();
    src.buffer = buf;
    const filt = c.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.setValueAtTime(2200, t);
    filt.frequency.exponentialRampToValueAtTime(120, t + dur);
    filt.Q.value = 2.5;
    const gain = makeGain(0.55, t, dur);
    src.connect(filt); filt.connect(gain);
    src.start(t);
  }

    const buf  = c.createBuffer(1, size, c.sampleRate);
    const d    = buf.getChannelData(0);
    for (let i = 0; i < size; i++) d[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource();
    noise.buffer = buf;
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 0.5;
    noise.connect(bp); bp.connect(makeGain(0.5, t, 0.05));
    noise.start(t);
  }

  // Descending gurgling glorp
  function playGlorp() {
    const c = ctx(), t = c.currentTime;
    const osc = c.createOscillator();
    const lfo = c.createOscillator();
    const lg  = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(420, t);
    osc.frequency.exponentialRampToValueAtTime(80, t + 0.38);
    lfo.frequency.setValueAtTime(28, t);
    lfo.frequency.exponentialRampToValueAtTime(5, t + 0.38);
    lg.gain.setValueAtTime(55, t);
    lg.gain.exponentialRampToValueAtTime(2, t + 0.38);
    lfo.connect(lg); lg.connect(osc.frequency);
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 650;
    osc.connect(lp); lp.connect(makeGain(0.45, t, 0.42));
    lfo.start(t); osc.start(t);
    lfo.stop(t + 0.42); osc.stop(t + 0.42);
  }

  // Sad trombone descending wah
  function playWomp() {
    const c = ctx(), t = c.currentTime;
    const osc = c.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(58, t + 0.52);
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2200, t);
    lp.frequency.exponentialRampToValueAtTime(180, t + 0.52);
    osc.connect(lp); lp.connect(makeGain(0.32, t, 0.56));
    osc.start(t); osc.stop(t + 0.56);
  }

  // Organ chord stab
  function playOrgan() {
    const c = ctx(), t = c.currentTime;
    [130, 165, 196, 261].forEach(f => {
      const osc  = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'square';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.setValueAtTime(0.1, t + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(t); osc.stop(t + 0.5);
    });
  }

  // Rapid snare drum roll
  function playDrumRoll() {
    const c = ctx(), t = c.currentTime;
    for (let i = 0; i < 14; i++) {
      const size = Math.floor(c.sampleRate * 0.035);
      const buf  = c.createBuffer(1, size, c.sampleRate);
      const d    = buf.getChannelData(0);
      for (let j = 0; j < size; j++) d[j] = Math.random() * 2 - 1;
      const noise = c.createBufferSource();
      noise.buffer = buf;
      const hp  = c.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 2000;
      const gain = c.createGain();
      const st   = t + i * 0.038;
      gain.gain.setValueAtTime(0.1 + (i / 14) * 0.2, st);
      gain.gain.exponentialRampToValueAtTime(0.0001, st + 0.035);
      noise.connect(hp); hp.connect(gain); gain.connect(c.destination);
      noise.start(st);
    }
  }

  // Engine revving up
  function playRevUp() {
    const c = ctx(), t = c.currentTime;
    const size = Math.floor(c.sampleRate * 0.5);
    const buf  = c.createBuffer(1, size, c.sampleRate);
    const d    = buf.getChannelData(0);
    for (let i = 0; i < size; i++) d[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource();
    noise.buffer = buf;
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(80, t);
    bp.frequency.exponentialRampToValueAtTime(900, t + 0.5);
    bp.Q.value = 9;
    noise.connect(bp); bp.connect(makeGain(0.5, t, 0.52));
    noise.start(t);
  }

  // Thunder crack + rumble
  function playThunder() {
    const c = ctx(), t = c.currentTime;
    const size = Math.floor(c.sampleRate * 0.7);
    const buf  = c.createBuffer(1, size, c.sampleRate);
    const d    = buf.getChannelData(0);
    for (let i = 0; i < size; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / size, 0.4);
    const noise = c.createBufferSource();
    noise.buffer = buf;
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 350;
    noise.connect(lp); lp.connect(makeGain(0.8, t, 0.72));
    noise.start(t);
  }

  // Sci-fi modulated beam
  function playScifi() {
    const c = ctx(), t = c.currentTime;
    const osc = c.createOscillator();
    const lfo = c.createOscillator();
    const lg  = c.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(350, t);
    osc.frequency.exponentialRampToValueAtTime(1800, t + 0.32);
    lfo.frequency.value = 38;
    lg.gain.value = 220;
    lfo.connect(lg); lg.connect(osc.frequency);
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 3; bp.frequency.value = 1000;
    osc.connect(bp); bp.connect(makeGain(0.2, t, 0.36));
    lfo.start(t); osc.start(t);
    lfo.stop(t + 0.36); osc.stop(t + 0.36);
  }

  // Harp glissando
  function playHarp() {
    const c = ctx(), t = c.currentTime;
    [523, 659, 784, 880, 1047, 1175, 1319].forEach((f, i) => {
      const osc  = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'triangle';
      osc.frequency.value = f;
      const st = t + i * 0.042;
      gain.gain.setValueAtTime(0.2, st);
      gain.gain.exponentialRampToValueAtTime(0.0001, st + 0.65);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(st); osc.stop(st + 0.65);
    });
  }

  // Electric crackle bursts
  function playCrackle() {
    const c = ctx(), t = c.currentTime;
    for (let i = 0; i < 12; i++) {
      const size = Math.floor(c.sampleRate * 0.012);
      const buf  = c.createBuffer(1, size, c.sampleRate);
      const d    = buf.getChannelData(0);
      for (let j = 0; j < size; j++) d[j] = Math.random() > 0.5 ? (Math.random() * 2 - 1) * 0.9 : 0;
      const src  = c.createBufferSource();
      src.buffer = buf;
      const gain = c.createGain();
      const st   = t + i * 0.033 + Math.random() * 0.012;
      gain.gain.setValueAtTime(0.32, st);
      gain.gain.exponentialRampToValueAtTime(0.0001, st + 0.012);
      src.connect(gain); gain.connect(c.destination);
      src.start(st);
    }
  }

  // Triple bubble pop
  function playBubblePop() {
    const c = ctx(), t = c.currentTime;
    [0, 0.09, 0.16].forEach((off, i) => {
      const osc  = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600 - i * 100, t + off);
      osc.frequency.exponentialRampToValueAtTime(90, t + off + 0.11);
      gain.gain.setValueAtTime(0, t + off);
      gain.gain.linearRampToValueAtTime(0.42, t + off + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.13);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(t + off); osc.stop(t + off + 0.13);
    });
  }

    const c = ctx(), t = c.currentTime;
    const osc = c.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(440, t);
    osc.frequency.setValueAtTime(370, t + 0.1);
    osc.frequency.setValueAtTime(440, t + 0.2);
    osc.frequency.setValueAtTime(370, t + 0.3);
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    osc.connect(lp); lp.connect(makeGain(0.28, t, 0.42));
    osc.start(t); osc.stop(t + 0.42);

    const c = ctx(), t = c.currentTime;

    const lfo = c.createOscillator();
    const lg  = c.createGain();
    osc.type = 'triangle';

  function doSplit(onDone) {
    const rect = btn.getBoundingClientRect();

    const makeClone = (side) => {
      const c = document.createElement('button');
      c.className = 'split-clone';
      c.textContent = btn.textContent;
      c.style.cssText = `
        left:${rect.left}px; top:${rect.top}px;
        width:${rect.width}px; height:${rect.height}px;
        font-family:inherit; font-size:${getComputedStyle(btn).fontSize};
        font-weight:900; letter-spacing:0.04em;
        background:${btn.style.background || 'linear-gradient(145deg,#ff6b35,#f7931e)'};
        color:#fff; text-shadow:2px 3px 6px rgba(0,0,0,.35);
        box-shadow:${btn.style.boxShadow || '0 8px 0 #b84a00, 0 12px 30px rgba(0,0,0,.5)'};
        clip-path:${side === 'L' ? 'inset(0 50% 0 0)' : 'inset(0 0 0 50%)'};
        border-radius:18px;
      `;
      document.body.appendChild(c);
      return c;
    };

    const L = makeClone('L');
    const R = makeClone('R');
    btn.style.visibility = 'hidden';

    requestAnimationFrame(() => requestAnimationFrame(() => {
      L.style.transform = 'translateX(-70px)';
      R.style.transform = 'translateX(70px)';
    }));

    setTimeout(() => {
      L.style.transform = '';
      R.style.transform = '';
      setTimeout(() => {
        L.remove(); R.remove();
        btn.style.visibility = '';
        onDone();
      }, 300);
    }, 300);
  }

  function pickAnim() {
    let idx;
    do { idx = Math.floor(Math.random() * ANIMS.length); }
    while (ANIMS.length > 1 && idx === lastAnim);
    lastAnim = idx;
    return ANIMS[idx];
  }

  /* ── Button colour & label ── */
  function randomise() {
    btn.textContent = labels[Math.floor(Math.random() * labels.length)];
    const [a, b, shadow] = palette[Math.floor(Math.random() * palette.length)];
    btn.style.background  = `linear-gradient(145deg, ${a}, ${b})`;
    btn.style.boxShadow   = `0 8px 0 ${shadow}, 0 12px 30px rgba(0,0,0,.5)`;
  }

  /* ── Press handler ── */
  function handlePress(e) {
    e.preventDefault();
    if (isAnimating) return;
    isAnimating = true;

    pressCount++;
    countEl.textContent = pressCount;
    counterEl.classList.remove('bump');
    void counterEl.offsetWidth;
    counterEl.classList.add('bump');

    randomise();

    const anim = pickAnim();
    anim.run(() => { isAnimating = false; });
  }

  btn.addEventListener('pointerdown', handlePress);
})();
